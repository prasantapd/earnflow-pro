services:
  # Render Static Site Configuration (100% Free Forever, Fast Global CDN, Automatic HTTPS)
  - type: web
    name: earnflow-pro
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
